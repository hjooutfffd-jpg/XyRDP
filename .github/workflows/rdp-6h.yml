name: RdpFree — RDP Optimized for Games (Tailscale)

on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: 'Durasi sesi (menit)'
        required: false
        default: '360'
        type: string
      perpanjang_otomatis:
        description: 'Lanjutkan otomatis sesi berikutnya'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak

permissions:
  contents: write
  actions: write

concurrency:
  group: rdpfree-active-session
  cancel-in-progress: false

jobs:
  rdp:
    name: Sesi RDP (Optimized Setup)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DUR: ${{ inputs.durasi_menit || '360' }}
      RDP_USER: xyadmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      PERPANJANG_OTOMATIS: ${{ inputs.perpanjang_otomatis || 'ya' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dasar RDP
        shell: pwsh
        run: ./scripts/setup-rdp.ps1

      - name: Pulihkan simpanan sesi sebelumnya
        shell: pwsh
        continue-on-error: true
        run: ./scripts/restore-state.ps1

      - name: Optimasi CPU & Performa Maksimal
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "تفعيل أقصى أداء للمعالج (High Performance)..."
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          Write-Host "تحسين الذاكرة الافتراضية (Virtual Memory / Pagefile)..."
          $sysDrive = Get-WmiObject Win32_ComputerSystem
          $sysDrive.AutomaticManagedPagefile = $False
          $sysDrive.Put()
          $pagefile = Get-WmiObject Win32_PageFileSetting -Filter "Name='C:\\pagefile.sys'"
          if ($pagefile) {
            $pagefile.InitialSize = 8192
            $pagefile.MaximumSize = 16384
            $pagefile.Put()
          } else {
            Set-CimInstance -Query "Select * from Win32_ComputerSystem" -Property @{AutomaticManagedPagefile=$false}
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize = 8192; MaximumSize = 16384}
          }

      - name: Setup akses Tailscale
        shell: pwsh
        run: ./scripts/setup-akses.ps1

      - name: Jaga sesi tetap hidup (keepalive)
        shell: pwsh
        run: ./scripts/keepalive.ps1

      - name: Simpan sesi (persist-state.ps1)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: ./scripts/persist-state.ps1

      - name: Upload simpanan sesi
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xyrdp-state
          path: C:\XyRDP\persist\xyrdp-state.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Finalize (matikan sesi)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: ./scripts/finalize-rdp.ps1

      - name: Estafet sesi berikutnya (auto-renew)
        if: ${{ success() && (inputs.perpanjang_otomatis || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $hdr = @{
            Authorization          = "Bearer $($env:GITHUB_TOKEN)"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'XyRDP-AutoRenew'
          }
          $body = @{
            ref    = 'main'
            inputs = @{
              durasi_menit        = "$($env:DUR)"
              perpanjang_otomatis = "$($env:PERPANJANG_OTOMATIS)"
            }
          } | ConvertTo-Json -Depth 5
          try {
            $ownerName = ($env:GITHUB_REPOSITORY -split '/')[0]
            $allowAutoRenew = $true
            try {
              $usrObj = Invoke-RestMethod -Uri "https://api.github.com/users/$ownerName" -Headers $hdr -TimeoutSec 15
              if ($usrObj -and $usrObj.created_at) {
                $ageDays = ([DateTime]::UtcNow - [DateTime]::Parse($usrObj.created_at).ToUniversalTime()).TotalDays
                if ($ageDays -lt 7) { $allowAutoRenew = $false }
              }
            } catch {}

            if ($allowAutoRenew) {
              Start-Sleep -Seconds (Get-Random -Minimum 15 -Maximum 26)
              Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/rdp-6h.yml/dispatches" `
                -Headers $hdr -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
            }
          } catch {}
          
