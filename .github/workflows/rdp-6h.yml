# rdpfree-workflow-schema: 5
name: RdpFree — RDP 6 Jam (Minimalis)

on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: 'Durasi sesi (menit, 10–360)'
        required: false
        default: '360'
        type: string
      hostname:
        description: 'Prefix hostname VM'
        required: false
        default: 'rdpfree'
        type: string
      rdp_user:
        description: 'Username RDP (3–20 karakter)'
        required: false
        default: 'xyadmin'
        type: string
      perpanjang_otomatis:
        description: 'Lanjutkan otomatis ke sesi berikutnya saat waktu habis'
        required: false
        default: 'ya'
        type: choice
        options:
          - ya
          - tidak

permissions:
  contents: write
  actions: write

concurrency:
  group: rdpfree-active-session
  cancel-in-progress: false

jobs:
  rdp:
    name: Sesi RDP (Windows 2022)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DUR: ${{ inputs.durasi_menit || '360' }}
      HOSTNAME: ${{ inputs.hostname || 'rdpfree' }}
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      AKSES: tailscale
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      PERPANJANG_OTOMATIS: ${{ inputs.perpanjang_otomatis || 'ya' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bersihkan run lama
        shell: pwsh
        continue-on-error: true
        run: ./scripts/cleanup-actions.ps1

      - name: Setup dasar RDP (user + port 3389)
        shell: pwsh
        run: ./scripts/setup-rdp.ps1

      - name: Pulihkan simpanan sesi sebelumnya
        shell: pwsh
        continue-on-error: true
        run: ./scripts/restore-state.ps1

      - name: Optimasi storage runner
        timeout-minutes: 15
        shell: pwsh
        continue-on-error: true
        run: ./scripts/optimize-storage.ps1

      - name: Boost FPS & Performa Dasar
        timeout-minutes: 8
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-fps-boost.ps1

      - name: Tampilan Windows 10 + Dark Mode
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-win10.ps1

      - name: Setup akses Tailscale
        shell: pwsh
        run: ./scripts/setup-akses.ps1

      - name: Publish status siap pakai
        shell: pwsh
        continue-on-error: true
        run: ./scripts/publish-status.ps1

      - name: Jaga sesi tetap hidup (keepalive)
        shell: pwsh
        run: ./scripts/keepalive.ps1

      - name: Simpan sesi (persist-state.ps1)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: ./scripts/persist-state.ps1

      - name: Upload simpanan sesi
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xyrdp-state
          path: C:\XyRDP\persist\xyrdp-state.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Finalize (matikan sesi + bersihkan status)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: ./scripts/finalize-rdp.ps1

      - name: Estafet sesi berikutnya (auto-renew)
        if: ${{ success() && (inputs.perpanjang_otomatis || 'ya') != 'tidak' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $hdr = @{
            Authorization          = "Bearer $($env:GITHUB_TOKEN)"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'XyRDP-AutoRenew'
          }
          $body = @{
            ref    = 'main'
            inputs = @{
              durasi_menit        = "$($env:DUR)"
              hostname            = "$($env:HOSTNAME)"
              rdp_user            = "$($env:RDP_USER)"
              perpanjang_otomatis = "$($env:PERPANJANG_OTOMATIS)"
            }
          } | ConvertTo-Json -Depth 5
          try {
            $ownerName = ($env:GITHUB_REPOSITORY -split '/')[0]
            $allowAutoRenew = $true
            try {
              $usrObj = Invoke-RestMethod -Uri "https://api.github.com/users/$ownerName" -Headers $hdr -TimeoutSec 15
              if ($usrObj -and $usrObj.created_at) {
                $ageDays = ([DateTime]::UtcNow - [DateTime]::Parse($usrObj.created_at).ToUniversalTime()).TotalDays
                if ($ageDays -lt 7) {
                  Write-Host "Anti-Suspend Guard: Akun @$ownerName masih berumur $([math]::Round($ageDays,1)) hari (< 7 hari). Auto-retrigger dilewati."
                  $allowAutoRenew = $false
                }
              }
            } catch {}

            if ($allowAutoRenew) {
              Start-Sleep -Seconds (Get-Random -Minimum 15 -Maximum 26)
              Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/rdp-6h.yml/dispatches" `
                -Headers $hdr -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
              Write-Host 'Sesi berikutnya berhasil dijadwalkan otomatis.'
            }
          } catch {
            Write-Host "Auto-renew dilewati: $($_.Exception.Message)"
          }
          
